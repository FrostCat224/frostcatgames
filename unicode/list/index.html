
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode Characters</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">

    <style>
        #unicodeSearch {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: Verdana;
        }

        #unicodeGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
        }

        .unicode-character {
            background: white;
            padding: 12px 5px;
            text-align: center;
            cursor: pointer;
            color: black;
        }

        .unicode-symbol {
            font-size: 30px;
            min-height: 38px;
        }

        .unicode-code {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
        }

        #pagination {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        #pagination button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <img src="/img/textlogo.png" alt="FrostCatGames">

        <nav>
            <a href="/">Home</a>
            <a href="/stuff">Stuff</a>
            <a href="/archive">Archive</a>
            <a href="/info">Info</a>
            <a href="/search">Search</a>
        </nav>
    </header>

    <main>
        <h1>All Unicode Characters</h1>
        <p>Click a character to copy it.</p>

        <input
            type="text"
            id="unicodeSearch"
            placeholder="Search code point (e.g. U+0041) or character..."
        >

        <p id="counter">Loading...</p>

        <div id="unicodeGrid"></div>

        <div id="pagination">
            <button id="previous">Previous</button>
            <span id="pageInfo"></span>
            <button id="next">Next</button>
        </div>
    </main>

    
<script>
    const PAGE_SIZE = 500;
    const UNICODE_DATA_URL =
        "https://www.unicode.org/Public/UCD/latest/ucd/UnicodeData.txt";

    let characters = [];
    let filteredCharacters = [];
    let currentPage = 0;

    const grid = document.getElementById("unicodeGrid");
    const counter = document.getElementById("counter");
    const pageInfo = document.getElementById("pageInfo");

    async function loadCharacters() {
        try {
            counter.textContent = "Loading Unicode database...";

            const response = await fetch(UNICODE_DATA_URL);

            if (!response.ok) {
                throw new Error("Could not load Unicode database.");
            }

            const data = await response.text();

            const codes = new Set();

            data.split("\n").forEach(line => {
                const parts = line.split(";");

                if (parts.length < 2) return;

                const code = parseInt(parts[0], 16);
                const name = parts[1];

                // Ignore surrogate characters.
                if (code >= 0xD800 && code <= 0xDFFF) return;

                // Ignore Unicode range markers.
                if (name.includes(", First>") ||
                    name.includes(", Last>")) return;

                codes.add(code);
            });

            characters = Array.from(codes).sort((a, b) => a - b);
            filteredCharacters = characters;

            render();

        } catch (error) {
            counter.textContent =
                "Could not load Unicode characters. Please try again.";
            console.error(error);
        }
    }

    function render() {
        grid.innerHTML = "";

        const start = currentPage * PAGE_SIZE;
        const end = Math.min(
            start + PAGE_SIZE,
            filteredCharacters.length
        );

        const fragment = document.createDocumentFragment();

        for (let i = start; i < end; i++) {
            const code = filteredCharacters[i];
            const character = String.fromCodePoint(code);

            const item = document.createElement("div");
            item.className = "unicode-character";
            item.title = "Click to copy " + character;

            const symbol = document.createElement("div");
            symbol.className = "unicode-symbol";
            symbol.textContent = character;

            const codeLabel = document.createElement("div");
            codeLabel.className = "unicode-code";
            codeLabel.textContent =
                "U+" + code.toString(16).toUpperCase().padStart(4, "0");

            item.appendChild(symbol);
            item.appendChild(codeLabel);

            item.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(character);
                    counter.textContent = "Copied " + character + "!";
                } catch (error) {
                    counter.textContent = "Could not copy character.";
                }
            });

            fragment.appendChild(item);
        }

        grid.appendChild(fragment);

        const totalPages = Math.ceil(
            filteredCharacters.length / PAGE_SIZE
        );

        counter.textContent =
            filteredCharacters.length.toLocaleString() +
            " characters found";

        pageInfo.textContent =
            "Page " + (currentPage + 1) + " of " + totalPages;

        document.getElementById("previous").disabled =
            currentPage === 0;

        document.getElementById("next").disabled =
            currentPage >= totalPages - 1;
    }

    document.getElementById("previous").onclick = () => {
        if (currentPage > 0) {
            currentPage--;
            render();
        }
    };

    document.getElementById("next").onclick = () => {
        if ((currentPage + 1) * PAGE_SIZE < filteredCharacters.length) {
            currentPage++;
            render();
        }
    };

    document.getElementById("unicodeSearch").addEventListener(
        "input",
        event => {
            const query = event.target.value.trim().toLowerCase();

            if (!query) {
                filteredCharacters = characters;
            } else if (/^u\+[0-9a-f]+$/i.test(query)) {
                const code = parseInt(query.slice(2), 16);

                filteredCharacters = characters.filter(
                    c => c === code
                );
            } else {
                filteredCharacters = characters.filter(code => {
                    return String.fromCodePoint(code) === query;
                });
            }

            currentPage = 0;
            render();
        }
    );

    loadCharacters();
</script>

</body>
</html>
