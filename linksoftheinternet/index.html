<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links of the Internet</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f4f7; color: #222; }
    header { background: #263c59; color: white; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 23px; }
    header p { margin: 8px 0 0; font-size: 13px; color: #d7e2ef; }
    .layout { display: flex; min-height: calc(100vh - 85px); }
    aside { width: 270px; flex-shrink: 0; background: #e4e9ef; border-right: 1px solid #cbd3dd; padding: 18px; }
    main { flex: 1; min-width: 0; max-width: 1050px; padding: 28px; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #b9c3cf; border-radius: 5px; background: white; }
    textarea { resize: vertical; min-height: 90px; }
    button { border: 0; border-radius: 5px; padding: 10px 13px; background: #263c59; color: white; cursor: pointer; }
    button:hover { background: #365579; }
    button.secondary { background: #e1e6ed; color: #222; border: 1px solid #bdc7d3; }
    button.secondary:hover { background: #d2dae4; }
    .search { margin-bottom: 15px; }
    .sidebar-title { font-size: 12px; color: #536579; text-transform: uppercase; font-weight: bold; margin: 20px 0 8px; }
    .side-link { display: block; padding: 8px 10px; border-radius: 5px; color: #263c59; cursor: pointer; word-break: break-word; }
    .side-link:hover { background: #d3dce7; }
    .domain-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .favicon { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; background: white; border: 1px solid #ddd; padding: 5px; }
    .domain-header h2 { margin: 0 0 7px; font-size: 24px; word-break: break-word; }
    .muted { color: #657384; font-size: 13px; }
    .panel { background: white; border: 1px solid #d7dee6; border-radius: 8px; padding: 18px; margin-bottom: 18px; }
    .panel h3 { margin: 0 0 14px; font-size: 17px; }
    .domain-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .domain-card { display: flex; align-items: center; gap: 12px; border: 1px solid #d8dfe7; background: #f8fafc; padding: 12px; border-radius: 7px; cursor: pointer; min-width: 0; }
    .domain-card:hover { background: #edf3f9; border-color: #9aafc5; }
    .domain-card img { width: 32px; height: 32px; object-fit: contain; background: white; border-radius: 5px; }
    .domain-card div { min-width: 0; }
    .domain-card strong, .domain-card small { display: block; overflow-wrap: anywhere; }
    .domain-card small { color: #667788; margin-top: 4px; }
    .url { overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    #status { font-size: 13px; color: #536579; margin-top: 10px; }
    @media (max-width: 760px) { .layout { display: block; } aside { width: 100%; border-right: 0; border-bottom: 1px solid #cbd3dd; } main { padding: 18px; } }
</style>
</head>
<body>
<header><h1>Links of the internet</h1><p>A wiki for exploring connected websites and domains</p></header>
<div class="layout">
    <aside>
        <input id="search" class="search" placeholder="Search domains..." autocomplete="off">
        <div id="searchResults"></div>
        <div class="actions"><button class="secondary" id="homeButton">Go to Domain #1</button></div>
    </aside>
    <main><div id="page"><p>Loading domain wiki...</p></div><div id="status"></div></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmLRPxFVIl8dSWd2Y7rR2PMVFRHuU0UEA",
  authDomain: "mapoftheinternet.firebaseapp.com",
  databaseURL: "https://mapoftheinternet-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mapoftheinternet",
  storageBucket: "mapoftheinternet.firebasestorage.app",
  messagingSenderId: "49526153880",
  appId: "1:49526153880:web:0f87bd72fee625990726ed"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const pageEl = document.getElementById("page");
const searchResultsEl = document.getElementById("searchResults");
const statusEl = document.getElementById("status");
const searchEl = document.getElementById("search");
const CACHE_KEY = "domainWikiIndexCache_v1";
const CACHE_TTL = 5 * 60 * 1000; 
let index = {};
let currentId = 1;
let currentDomain = null;

function safeFavicon(url) { try { return new URL(url).origin + "/favicon.ico"; } catch { return ""; } }
function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
function normalizeUrl(url) { if (!/^https?:\/\//i.test(url)) url = "https://" + url; return url; }
function getIndexed(id) { return index[String(id)] || null; }
function updateCache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify({savedAt:Date.now(), index})); } catch {} }
function readCache() { try { const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); if(c && Date.now()-c.savedAt<CACHE_TTL && c.index) return c.index; } catch {} return null; }
function makeIndexEntry(d) { return {id:d.id, name:d.name||"", url:d.url||"", favicon:d.favicon||safeFavicon(d.url||""), links:Array.isArray(d.links)?d.links:[]}; }
function renderSearch(query="") {
    query=query.toLowerCase().trim();
    if(!query){searchResultsEl.innerHTML="";return;}
    const found=Object.entries(index).filter(([id,d])=>String(id).includes(query)||(d.name||"").toLowerCase().includes(query)||(d.url||"").toLowerCase().includes(query)).slice(0,50);
    searchResultsEl.innerHTML=`<div class="sidebar-title">Search results (${found.length}${found.length===50?"+":""})</div>`+found.map(([id,d])=>`<div class="side-link" onclick="window.openDomain(${Number(id)})">#${id} - ${escapeHtml(d.name||d.url||"Unnamed")}</div>`).join("");
}
function renderPage(domain) {
    currentDomain=domain;
    if(!domain){pageEl.innerHTML=`<div class="panel"><h2>Domain #${currentId} not found</h2><p>This ID doesn't exist in the database.</p><button onclick="window.openDomain(1)">Return to Domain #1</button></div>`;return;}
    const favicon=domain.favicon||safeFavicon(domain.url);
    const linkedIds=Array.isArray(domain.links)?domain.links:[];
    const links=linkedIds.map(id=>{
        const target=getIndexed(id); if(!target)return `<div class="domain-card" onclick="window.openDomain(${Number(id)})"><div><strong>#${id}</strong><small>Loading/unknown in index</small></div></div>`;
        const icon=target.favicon||safeFavicon(target.url);
        return `<div class="domain-card" onclick="window.openDomain(${Number(id)})"><img src="${escapeHtml(icon)}" data-domain="${escapeHtml(target.url)}" onerror="this.onerror=null;this.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(this.dataset.domain)+'&sz=64'" alt=""><div><strong>#${id} - ${escapeHtml(target.name||"Unnamed")}</strong><small>${escapeHtml(target.url||"")}</small></div></div>`;
    }).join("");
    pageEl.innerHTML=`<div class="domain-header"><img class="favicon" src="${escapeHtml(favicon)}" data-domain="${escapeHtml(domain.url||"")}" onerror="this.onerror=null;this.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(this.dataset.domain)+'&sz=64'" alt="Favicon"><div><h2>${escapeHtml(domain.name||"Unnamed domain")}</h2><div class="muted">Domain ID: #${currentId}</div></div></div><div class="panel"><h3>Website</h3><div class="url"><a href="${escapeHtml(domain.url||"#")}" target="_blank" rel="noopener noreferrer">${escapeHtml(domain.url||"No URL set")}</a></div></div><div class="panel"><h3>Links (${linkedIds.length})</h3>${linkedIds.length?`<div class="domain-list">${links}</div>`:`<p class="muted">No linked domains yet.</p>`}</div>`;
}
async function openDomain(id) {
    id=Number(id); if(!Number.isFinite(id)||id<1)return;
    currentId=id; pageEl.innerHTML=`<p>Loading Domain #${id}...</p>`;
    try {
        const snap=await get(ref(db,"domains/"+id));
        if(!snap.exists()){renderPage(null);return;}
        const domain=snap.val();
        // Refresh index metadata for this domain from the actual domain record.
        index[String(id)]=makeIndexEntry(domain); updateCache(); renderPage(domain);
    } catch(e){pageEl.innerHTML=`<div class="panel">Could not load domain: ${escapeHtml(e.message)}</div>`;}
    window.scrollTo({top:0,behavior:"smooth"});
}
window.openDomain=openDomain;
document.getElementById("homeButton").addEventListener("click",()=>openDomain(1));
searchEl.addEventListener("input",()=>renderSearch(searchEl.value));

async function loadIndex() {

    const cached=readCache();
    if(cached){index=cached;renderSearch(searchEl.value);return;}
    const idxSnap=await get(ref(db,"domainIndex"));
    if(idxSnap.exists()) {
        index=idxSnap.val()||{}; updateCache(); renderSearch(searchEl.value); return;
    }

    statusEl.textContent="Building lightweight index (one-time setup)...";
    const fullSnap=await get(ref(db,"domains"));
    const full=fullSnap.val()||{}; const rebuilt={};
    for(const [id,d] of Object.entries(full)) if(d) rebuilt[id]=makeIndexEntry({...d,id:Number(d.id||id)});
    await set(ref(db,"domainIndex"),rebuilt);
    index=rebuilt; updateCache(); renderSearch(searchEl.value);
    statusEl.textContent=" ";
}
async function saveIndexEntry(id,domain) {
    const entry=makeIndexEntry({...domain,id:Number(id)});
    await set(ref(db,"domainIndex/"+id),entry);
    index[String(id)]=entry; updateCache(); renderSearch(searchEl.value);
}
try {
    await signInAnonymously(auth);
    await loadIndex();
    await openDomain(1);
} catch(error) {
    statusEl.textContent="Firebase error: "+error.message+". Check Firebase Authentication and database rules.";
}
</script>
</body>
</html>
